name = "obsedium-tools"
compatibility_date = "2025-03-01"
workers_dev = false

# El dominio queda declarado aquí: sobrevive a cada despliegue.
routes = [{ pattern = "tools.obsedium.cl", custom_domain = true }]

# Sitio abierto y solo estático: Cloudflare sirve public/ directo. Cabeceras en public/_headers.
[assets]
directory = "./public"
