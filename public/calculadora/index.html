<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Calculadora científica</title>
<script>(function(){var t=null;try{t=localStorage.getItem("obsedium-tema")}catch(e){}if(t==="oscuro"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.tema="oscuro"})();</script>
<style>
  :root { --fondo: #f6f4ef; --panel: #ffffff; --borde: #ddd8cb; --texto: #1d1d1b; --suave: #6b675e; --acento: #2f5da8; }
  :root[data-tema="oscuro"] { --fondo: #15161a; --panel: #1e2025; --borde: #363940; --texto: #e7e5e0; --suave: #a29e95; --acento: #7ea6e6; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--borde); }
  h1 { font-size: 17px; margin: 0; }
  h1 a { color: inherit; text-decoration: none; }
  #b-tema { margin-left: auto; font-size: 15px; padding: 4px 10px; border: 1px solid var(--borde); border-radius: 8px; background: var(--panel); cursor: pointer; }
  main { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; align-items: flex-start; padding: 22px 16px; }

  /* el cuerpo de la calculadora (inspirado en la fx-82MS) */
  .casio { width: 100%; max-width: 430px; background: linear-gradient(#45475c, #34364a); border-radius: 28px 28px 42px 42px; padding: 18px 20px 26px; box-shadow: 0 12px 30px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.08); color: #e8e8ee; user-select: none; }
  .marca { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px; }
  .marca b { font: 800 17px/1 Arial, sans-serif; letter-spacing: .06em; color: #c9cad4; }
  .marca i { font: italic 15px Georgia, serif; color: #c9cad4; }
  .lema { text-align: center; color: #e0617a; font: 600 13px Arial, sans-serif; letter-spacing: .25em; margin: 8px 0 12px; }
  .lcd { background: #c7d0bd; border-radius: 6px; border: 7px solid #26283a; padding: 4px 10px 8px; color: #1c2218; box-shadow: inset 0 2px 6px rgba(0,0,0,.35); font-family: ui-monospace, "DejaVu Sans Mono", Menlo, monospace; }
  .ind { display: flex; gap: 10px; font: 700 10px Arial, sans-serif; height: 13px; }
  .ind span { opacity: .12; } .ind span.on { opacity: 1; }
  .ind .ang { margin-left: auto; opacity: 1; }
  #entrada { width: 100%; border: 0; background: transparent; color: inherit; font: 20px/1.3 ui-monospace, "DejaVu Sans Mono", Menlo, monospace; padding: 2px 0; outline: none; caret-color: #1c2218; }
  #resultado { min-height: 38px; text-align: right; font-size: 27px; line-height: 38px; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
  #resultado.chico { font-size: 13px; line-height: 1.3; white-space: normal; text-align: left; padding-top: 4px; }
  #aviso { min-height: 15px; font: 11px/1.3 Arial, sans-serif; color: #5b3a1a; }
  .lcd span, .hist span { color: inherit !important; }
  .lcd sup, .hist sup { font-size: .6em; }

  .teclas { display: grid; gap: 10px 8px; margin-top: 16px; }
  .f6 { grid-template-columns: repeat(6, 1fr); }
  .n5 { grid-template-columns: repeat(5, 1fr); margin-top: 18px; gap: 14px 10px; }
  .t { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 1px; }
  .t small { font: 600 9.5px/1 Arial, sans-serif; color: #e0a33a; text-align: center; min-height: 10px; white-space: nowrap; }
  .t button { font: 600 14px Arial, sans-serif; border: 0; border-radius: 7px; padding: 7px 0; cursor: pointer; background: #22232f; color: #f2f2f5; box-shadow: 0 3px 0 #111219, inset 0 1px 0 rgba(255,255,255,.12); touch-action: manipulation; }
  .t button:active { transform: translateY(2px); box-shadow: 0 1px 0 #111219; }
  .t button:focus-visible { outline: 2px solid #e0a33a; }
  .ctrl button { background: #c3c4cf; color: #2a2b38; border-radius: 12px; font-size: 11.5px; box-shadow: 0 3px 0 #7c7d8a; }
  .n5 button { background: #b9bbc6; color: #23242f; font-size: 20px; padding: 9px 0; box-shadow: 0 3px 0 #6f717e, inset 0 1px 0 rgba(255,255,255,.5); }
  .n5 .rojo button { background: #c9505f; color: #fff; font-size: 16px; box-shadow: 0 3px 0 #7e2833; }
  .n5 .ope button { font-size: 16px; }
  .casio.shift [data-s] button { outline: 2px solid #e0a33a; outline-offset: -2px; }
  .casio.shift .k-shift button, .casio.hyp .k-hyp button { background: #e0a33a; color: #1d1d1b; }

  /* cinta de historial, como en Qalculate de escritorio */
  .cinta { width: 100%; max-width: 430px; background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 14px; }
  .cinta h2 { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin: 0 0 6px; }
  .cinta h2 button { font-size: 12px; border: 1px solid var(--borde); background: transparent; color: var(--suave); border-radius: 7px; padding: 2px 8px; cursor: pointer; }
  .hist { list-style: none; margin: 0; padding: 0; max-height: 70vh; overflow-y: auto; }
  .hist li { border-top: 1px dashed var(--borde); padding: 6px 2px; cursor: pointer; }
  .hist li:hover { background: color-mix(in srgb, var(--acento) 8%, transparent); }
  .hist .e { color: var(--suave); font-size: 13.5px; }
  .hist .r { text-align: right; font-size: 17px; }
  .vacio { color: var(--suave); font-size: 13.5px; }
  .pie { width: 100%; text-align: center; color: var(--suave); font-size: 12px; }
  .pie a { color: inherit; }
  @media (max-width: 400px) { .casio { padding: 14px 12px 22px; border-radius: 20px 20px 30px 30px; } .f6 .t button { font-size: 12.5px; } .t small { font-size: 8.5px; } }
</style>
</head>
<body>
<header>
  <h1><a href="/" title="Volver a Obsedium Tools">← </a>Calculadora científica</h1>
  <button id="b-tema" title="Modo claro u oscuro" aria-label="Cambiar entre modo claro y oscuro"></button>
</header>
<main>
  <section class="casio" id="casio" aria-label="Calculadora">
    <div class="marca"><b>OBSEDIUM</b><i>fx-Qalc</i></div>
    <div class="lema">Q·A·L·C</div>
    <div class="lcd">
      <div class="ind" aria-hidden="true"><span id="i-s">S</span><span id="i-h">hyp</span><span class="ang" id="i-ang">D</span></div>
      <input id="entrada" autocomplete="off" spellcheck="false" autocapitalize="off" aria-label="Expresión (escribe o pega, Enter calcula)" placeholder="cargando motor…" disabled>
      <div id="resultado" aria-live="polite">0</div>
      <div id="aviso"></div>
    </div>
    <div class="teclas f6" id="teclas-f"></div>
    <div class="teclas n5" id="teclas-n"></div>
  </section>
  <section class="cinta">
    <h2>Historial <button id="b-borrar">Borrar</button></h2>
    <ul class="hist" id="hist"></ul>
  </section>
  <p class="pie">Motor: <a href="https://qalculate.github.io/" target="_blank" rel="noopener">Qalculate!</a> vía <a href="https://github.com/stephtr/libqalculate-wasm" target="_blank" rel="noopener">libqalculate-wasm</a> (GPL-3.0, <a href="qalc/LICENSE-GPL3.txt">licencia</a>). Acepta × * · como multiplicar, unidades (5 m to cm) y ecuaciones (2x+3=7).</p>
</main>
<script src="qalc/libqalculate-0.0.6.js"></script>
<script>
const $ = id => document.getElementById(id);
const entrada = $("entrada"), resultado = $("resultado"), aviso = $("aviso"), casio = $("casio");
const leer = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// ---- teclas: [etiqueta, qué inserta, etiqueta SHIFT, qué inserta con SHIFT, clase]
// Las funciones de dos argumentos usan ";" porque la coma es el decimal.
const F = [
  ["SHIFT", "@shift", "", "", "ctrl k-shift"], ["DRG", "@drg", "", "", "ctrl"], ["◀", "@izq", "", "", "ctrl"],
  ["▶", "@der", "", "", "ctrl"], ["▲", "@arriba", "", "", "ctrl"], ["▼", "@abajo", "", "", "ctrl"],
  ["x⁻¹", "^(−1)", "x!", "!"], ["nCr", "comb(", "nPr", "perm("], ["√", "√(", "∛", "cbrt("],
  ["x²", "^2", "x³", "^3"], ["^", "^", "ˣ√", "root("], ["log", "log10(", "10ˣ", "10^"],
  ["ln", "ln(", "eˣ", "e^"], ["(−)", "−"], ["hyp", "@hyp", "", "", "k-hyp"],
  ["sin", "sin(", "sin⁻¹", "asin("], ["cos", "cos(", "cos⁻¹", "acos("], ["tan", "tan(", "tan⁻¹", "atan("],
  ["(", "("], [")", ")"], [";", ";"], ["π", "π", "e", "e"], ["%", "%", "°", "°"], ["x", "x", "=", "="],
];
const N = [
  ["7", "7"], ["8", "8"], ["9", "9"], ["DEL", "@del", "", "", "rojo"], ["AC", "@ac", "", "", "rojo"],
  ["4", "4"], ["5", "5"], ["6", "6"], ["×", "×", "", "", "ope"], ["÷", "/", "", "", "ope"],
  ["1", "1"], ["2", "2"], ["3", "3"], ["+", "+", "", "", "ope"], ["−", "−", "", "", "ope"],
  ["0", "0"], [",", ",", "Rnd", "round("], ["EXP", "E", "Ran#", "rand()"], ["Ans", "Ans", "", "", "ope"], ["=", "@igual", "", "", "ope"],
];
function pintarTeclas(cont, lista) {
  for (const [et, ins, set, sins, cls] of lista) {
    const d = document.createElement("div");
    d.className = "t " + (cls || "");
    if (sins) d.dataset.s = "";
    d.innerHTML = `<small></small><button type="button"></button>`;
    d.firstChild.textContent = set || "";
    const b = d.lastChild; b.textContent = et;
    b.addEventListener("pointerdown", e => e.preventDefault()); // no roba el foco: en el celular no abre el teclado
    b.onclick = () => tecla(ins, sins);
    cont.append(d);
  }
}
pintarTeclas($("teclas-f"), F);
pintarTeclas($("teclas-n"), N);

let shift = false, hyp = false;
function estado() {
  casio.classList.toggle("shift", shift); casio.classList.toggle("hyp", hyp);
  $("i-s").classList.toggle("on", shift); $("i-h").classList.toggle("on", hyp);
}
let recien = false; // tras "=": un operador sigue desde Ans, cualquier otra cosa reemplaza (como la Casio)
function insertar(txt) {
  if (recien && /^[+−\-×*\/^!%]/.test(txt)) entrada.value = "Ans";
  recien = false;
  const s = entrada.selectionStart ?? entrada.value.length, e = entrada.selectionEnd ?? s;
  entrada.setRangeText(txt, s, e, "end");
}
function mover(d) { const p = Math.max(0, Math.min(entrada.value.length, entrada.selectionStart + d)); entrada.setSelectionRange(p, p); }
function tecla(ins, sins) {
  if (ins === "@shift") { shift = !shift; return estado(); }
  if (ins === "@hyp") { hyp = !hyp; return estado(); }
  let txt = shift && sins ? sins : ins;
  shift = false;
  if (hyp && /^a?(sin|cos|tan)\($/.test(txt)) { txt = txt.replace("(", "h("); hyp = false; }
  estado();
  switch (txt) {
    case "@drg": return cambiarAngulo();
    case "@izq": return mover(-1);
    case "@der": return mover(1);
    case "@arriba": return navegar(-1);
    case "@abajo": return navegar(1);
    case "@del": {
      const s = entrada.selectionStart, e = entrada.selectionEnd;
      return s !== e ? entrada.setRangeText("", s, e, "end") : s > 0 && entrada.setRangeText("", s - 1, s, "end");
    }
    case "@ac": entrada.value = ""; resultado.textContent = "0"; resultado.classList.remove("chico"); aviso.textContent = ""; return;
    case "@igual": return calcular();
  }
  insertar(txt);
}

// ---- motor
let q = null;
const ANGULOS = [["D", 2, "grados"], ["R", 1, "radianes"], ["G", 3, "gradianes"]];
let ang = leer("calc-angulo", 0);
function aplicarAngulo() { const [l, n, nom] = ANGULOS[ang]; $("i-ang").textContent = l; $("i-ang").title = nom; q && q.set_option("angle " + n); }
function cambiarAngulo() { ang = (ang + 1) % 3; guardar("calc-angulo", ang); aplicarAngulo(); aviso.textContent = "Ángulos en " + ANGULOS[ang][2]; }

// Qalculate devuelve HTML (colores, <sup>, <i>) pero no escapa el texto entre comillas: se limpia antes de mostrarlo.
const PERMITIDAS = new Set(["SPAN", "SUP", "SUB", "I", "B"]);
function limpio(html) {
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html");
  for (const el of [...doc.body.querySelectorAll("*")].reverse()) {
    if (el === doc.body.firstChild) continue;
    if (!PERMITIDAS.has(el.tagName)) { el.replaceWith(el.textContent); continue; }
    for (const a of [...el.attributes]) el.removeAttribute(a.name);
  }
  return doc.body.firstChild.innerHTML;
}

// ponytail: Ans = la expresión anterior entre paréntesis (se recalcula exacta); se anida si encadenas muchos Ans.
let ans = leer("calc-ans", "0");
let hist = leer("calc-historial", []), pos = hist.length;
function calcular() {
  const crudo = entrada.value.trim();
  if (!crudo || !q) return;
  const expr = crudo.replace(/\bans\b/gi, `(${ans})`);
  const r = q.calculate(expr, 3000, 0);
  const errores = r.messages.filter(m => /^error/i.test(m));
  aviso.textContent = r.messages.map(m => m.replace(/^(Warning|Error): /, "")).join(" · ");
  if (errores.length) { resultado.textContent = "Math ERROR"; resultado.classList.remove("chico"); return; }
  const salida = limpio(r.output);
  resultado.innerHTML = salida;
  resultado.classList.toggle("chico", resultado.textContent.length > 26);
  resultado.scrollLeft = resultado.scrollWidth;
  if (!/=|\bto\b|→/.test(expr)) { ans = expr; guardar("calc-ans", ans); } // ecuaciones y conversiones no sirven como Ans
  hist.push({ crudo, entrada: limpio(r.input), salida });
  if (hist.length > 200) hist.shift();
  guardar("calc-historial", hist);
  pos = hist.length;
  pintarHist();
  entrada.setSelectionRange(0, entrada.value.length);
  recien = true;
}
function navegar(d) {
  if (!hist.length) return;
  pos = Math.max(0, Math.min(hist.length, pos + d));
  entrada.value = pos < hist.length ? hist[pos].crudo : "";
  entrada.setSelectionRange(entrada.value.length, entrada.value.length);
}
function pintarHist() {
  const ul = $("hist");
  ul.innerHTML = hist.length ? "" : `<li class="vacio">Aquí queda cada cálculo. Clic para reusarlo.</li>`;
  hist.slice().reverse().forEach(h => {
    const li = document.createElement("li");
    li.innerHTML = `<div class="e">${h.entrada}</div><div class="r">${/=/.test(h.salida) ? "" : "= "}${h.salida}</div>`;
    li.title = h.crudo;
    li.onclick = () => { entrada.value = h.crudo; entrada.focus(); };
    ul.append(li);
  });
}
$("b-borrar").onclick = () => { hist = []; pos = 0; guardar("calc-historial", hist); pintarHist(); };

entrada.addEventListener("pointerdown", () => { recien = false; });
entrada.addEventListener("beforeinput", e => {
  if (e.inputType === "insertText" && e.data) { e.preventDefault(); insertar(e.data); } else recien = false;
});
entrada.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); calcular(); }
  else if (e.key === "Escape") tecla("@ac");
  else if (e.key === "ArrowUp") { e.preventDefault(); navegar(-1); }
  else if (e.key === "ArrowDown") { e.preventDefault(); navegar(1); }
});

pintarHist(); aplicarAngulo(); estado();
Module({ locateFile: p => "qalc/libqalculate-0.0.6.wasm" }).then(m => {
  q = m;
  for (const o of ["decimal comma on", "digit grouping off", "precision 10"]) q.set_option(o);
  aplicarAngulo();
  entrada.disabled = false; entrada.placeholder = ""; entrada.focus();
}).catch(e => { entrada.placeholder = "no se pudo cargar el motor"; aviso.textContent = String(e); });

(function(){var b=$("b-tema");function p(){b.textContent=document.documentElement.dataset.tema==="oscuro"?"☀️":"🌙"}b.onclick=function(){var o=document.documentElement.dataset.tema!=="oscuro";if(o)document.documentElement.dataset.tema="oscuro";else delete document.documentElement.dataset.tema;try{localStorage.setItem("obsedium-tema",o?"oscuro":"claro")}catch(e){}p()};p()})();
</script>
</body>
</html>
